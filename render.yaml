services:
  - type: web
    name: nomyra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: nomyra
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        value: Nomyra Travels
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_WHATSAPP
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_LOCATION
        value: Northeast India
      - key: SITE_URL
        sync: false
      - key: INSTAGRAM_URL
        value: ""
      - key: FACEBOOK_URL
        value: ""
      - key: YOUTUBE_URL
        value: ""
      - key: WHATSAPP_CLOUD_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ADMIN_NUMBER
        sync: false
